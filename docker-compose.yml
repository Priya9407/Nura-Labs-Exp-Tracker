version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7-jammy
    container_name: experiment-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: experiment_platform
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - experiment-network

  # Redis cache/session store
  redis:
    image: redis:7-alpine
    container_name: experiment-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - experiment-network

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: experiment-platform
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=5000
      - MONGODB_URL=mongodb://mongodb:27017/experiment_platform
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_EMAIL=${SMTP_EMAIL:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5000}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    networks:
      - experiment-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  redis_data:

networks:
  experiment-network:
    driver: bridge
